name: Generate KMMS 2021 publication thumbnail

on:
  push:
    branches:
      - fix/research-fabric-kmms-thumbnail-2026-11-01
    paths:
      - .github/workflows/generate-kmms21-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research website
        uses: actions/checkout@v4
      - name: Generate faithful preview of first manuscript page
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          test -f assets/pdf/2021-KMMS.pdf
          mkdir -p assets/img/publication_preview
          pdftoppm -f 1 -l 1 -singlefile -scale-to 760 -png assets/pdf/2021-KMMS.pdf assets/img/publication_preview/2021-KMMS
          file assets/img/publication_preview/2021-KMMS.png
      - name: Commit actual manuscript thumbnail to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/publication_preview/2021-KMMS.png
          if ! git diff --staged --quiet; then
            git commit -m "Add authentic KMMS 2021 first-page thumbnail"
            git push
          fi
